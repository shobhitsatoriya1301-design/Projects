<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance & Leave Margin Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f7f9fa;
      color: #333;
      padding: 20px 10px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      color: #bdc3c7;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dcdfe3;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 16px;
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #ecf0f1;
      padding-bottom: 6px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .form-group {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #555;
    }

    input[type="text"],
    input[type="number"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      padding: 9px 15px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-add {
      background-color: #2c3e50;
      color: #fff;
      height: 38px;
    }

    .btn-action {
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      background: #fdfdfd;
      border-radius: 3px;
      margin-right: 2px;
    }

    .btn-delete {
      color: #c0392b;
      border-color: #e74c3c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: #f4f6f7;
      color: #444;
    }

    .status-safe {
      color: #27ae60;
      font-weight: bold;
    }

    .status-shortage {
      color: #c0392b;
      font-weight: bold;
    }

    .guidance {
      font-size: 12px;
      color: #555;
    }

    .rule-selector {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .rule-selector select {
      padding: 4px 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Campus Attendance & Leave Margin Planner</h1>
      <p>Track your lecture attendance, safe leave allowances, and minimum recovery classes.</p>
    </header>

    <!-- Global Target Setting -->
    <div class="card">
      <div class="rule-selector">
        <label for="minAttendance">Required Attendance Percentage:</label>
        <select id="minAttendance" onchange="renderSubjectTable()">
          <option value="75" selected>75% (Standard University Criterion)</option>
          <option value="70">70%</option>
          <option value="80">80%</option>
          <option value="85">85%</option>
          <option value="90">90%</option>
        </select>
      </div>

      <!-- Add Course Form -->
      <h2>Add a Subject</h2>
      <form id="addSubjectForm" onsubmit="handleAddSubject(event)">
        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label for="subName">Course Code / Name</label>
            <input type="text" id="subName" placeholder="e.g. MTH165 or Physics Lab" required>
          </div>
          <div class="form-group">
            <label for="attended">Classes Attended</label>
            <input type="number" id="attended" min="0" placeholder="e.g. 18" required>
          </div>
          <div class="form-group">
            <label for="total">Total Held</label>
            <input type="number" id="total" min="1" placeholder="e.g. 22" required>
          </div>
          <button type="submit" class="btn-add">Add Course</button>
        </div>
      </form>
    </div>

    <!-- Attendance Table -->
    <div class="card">
      <h2>Enrolled Courses</h2>
      <table id="subjectsTable">
        <thead>
          <tr>
            <th>Course</th>
            <th>Attended / Total</th>
            <th>Percentage</th>
            <th>Status & Advice</th>
            <th>Quick Update</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
      <div id="noData" style="text-align: center; padding: 20px; color: #777; display: none;">
        No courses added yet.
      </div>
    </div>
  </div>

  <script>
    const initialData = [
      { name: "MTH165", attended: 24, total: 28 },
      { name: "Basic Electrical Engineering", attended: 14, total: 22 },
      { name: "CSE111", attended: 19, total: 20 }
    ];

    function getSubjects() {
      const stored = localStorage.getItem("univ_attendance_data");
      if (stored) return JSON.parse(stored);
      localStorage.setItem("univ_attendance_data", JSON.stringify(initialData));
      return initialData;
    }

    function saveSubjects(data) {
      localStorage.setItem("univ_attendance_data", JSON.stringify(data));
      renderSubjectTable();
    }

    function calculateStatus(attended, total, requiredPct) {
      const currentPct = (attended / total) * 100;
      const target = requiredPct / 100;

      if (currentPct >= requiredPct) {
        // Can miss X classes: attended / (total + x) >= target => x <= (attended / target) - total
        const safeMiss = Math.floor(attended / target - total);
        return {
          pct: currentPct.toFixed(1),
          statusClass: "status-safe",
          text: safeMiss > 0 
            ? `You can safely miss the next ${safeMiss} class(es).` 
            : `On the edge! Do not miss the next class.`
        };
      } else {
        // Must attend Y consecutive classes: (attended + y) / (total + y) >= target => y >= (target*total - attended) / (1 - target)
        const mustAttend = Math.ceil((target * total - attended) / (1 - target));
        return {
          pct: currentPct.toFixed(1),
          statusClass: "status-shortage",
          text: `Shortage! Attend the next ${mustAttend} class(es) consecutively to reach ${requiredPct}%.`
        };
      }
    }

    function renderSubjectTable() {
      const list = getSubjects();
      const tbody = document.getElementById("tableBody");
      const noData = document.getElementById("noData");
      const requiredPct = Number(document.getElementById("minAttendance").value);

      tbody.innerHTML = "";

      if (list.length === 0) {
        noData.style.display = "block";
        return;
      }
      noData.style.display = "none";

      list.forEach((sub, idx) => {
        const stats = calculateStatus(sub.attended, sub.total, requiredPct);
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td><strong>${escapeHtml(sub.name)}</strong></td>
          <td>${sub.attended} / ${sub.total}</td>
          <td><span class="${stats.statusClass}">${stats.pct}%</span></td>
          <td><span class="guidance">${stats.text}</span></td>
          <td>
            <button class="btn-action" title="Mark present today" onclick="markToday(${idx}, true)">+ Present</button>
            <button class="btn-action" title="Mark absent today" onclick="markToday(${idx}, false)">+ Absent</button>
          </td>
          <td>
            <button class="btn-action btn-delete" onclick="deleteCourse(${idx})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function handleAddSubject(e) {
      e.preventDefault();
      const name = document.getElementById("subName").value.trim();
      const attended = parseInt(document.getElementById("attended").value, 10);
      const total = parseInt(document.getElementById("total").value, 10);

      if (attended > total) {
        alert("Attended classes cannot be greater than total classes held.");
        return;
      }

      const list = getSubjects();
      list.push({ name, attended, total });
      saveSubjects(list);

      document.getElementById("addSubjectForm").reset();
    }

    function markToday(index, wasPresent) {
      const list = getSubjects();
      list[index].total += 1;
      if (wasPresent) {
        list[index].attended += 1;
      }
      saveSubjects(list);
    }

    function deleteCourse(index) {
      const list = getSubjects();
      list.splice(index, 1);
      saveSubjects(list);
    }

    function escapeHtml(str) {
      const p = document.createElement("p");
      p.textContent = str;
      return p.innerHTML;
    }

    window.addEventListener("DOMContentLoaded", renderSubjectTable);
  </script>
</body>
</html>
